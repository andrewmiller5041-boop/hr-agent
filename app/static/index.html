<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Northwind HR Agent</title>
<style>
  body { font-family: -apple-system, Segoe UI, sans-serif; max-width: 900px; margin: 24px auto; padding: 0 16px; color: #1a1a1a; }
  h1 { font-size: 1.3rem; }
  #controls { display: flex; gap: 8px; margin-bottom: 12px; }
  #employeeId { width: 110px; }
  #message { flex: 1; }
  input, button, textarea { font-size: 0.95rem; padding: 8px; }
  button { cursor: pointer; }
  #answer { white-space: pre-wrap; background: #f6f6f8; border-radius: 8px; padding: 12px; margin-top: 12px; }
  .panel { margin-top: 16px; }
  .panel h3 { margin-bottom: 4px; font-size: 0.95rem; }
  pre { background: #0f172a; color: #e2e8f0; padding: 10px; border-radius: 8px; overflow-x: auto; font-size: 0.8rem; }
  .cite { border-left: 3px solid #6366f1; padding: 4px 10px; margin: 6px 0; background: #eef2ff; font-size: 0.85rem; }
  .badge { display: inline-block; background: #e0e7ff; color: #3730a3; border-radius: 999px; padding: 2px 10px; font-size: 0.75rem; margin-left: 8px; }
  #latency { color: #666; font-size: 0.8rem; }
</style>
</head>
<body>
  <h1>Northwind Analytics — HR Agent <span id="workflowBadge"></span></h1>
  <p>Ask a policy question, or try an agentic task, e.g. "Can employee E1001 work remotely from Colorado for six weeks?" or "Can employee E1002 take 3 PTO days next week?"</p>
  <div id="controls">
    <input id="employeeId" placeholder="employee_id (optional)" />
    <input id="message" placeholder="Ask a question..." />
    <button onclick="send()">Send</button>
  </div>
  <div id="latency"></div>
  <div id="answer"></div>

  <div class="panel">
    <h3>Citations</h3>
    <div id="citations"></div>
  </div>

  <div class="panel">
    <h3>Tool-call trace</h3>
    <pre id="trace"></pre>
  </div>

<script>
let history = [];

async function send() {
  const employeeId = document.getElementById('employeeId').value.trim() || null;
  const message = document.getElementById('message').value.trim();
  if (!message) return;

  document.getElementById('answer').textContent = 'Thinking...';
  const start = performance.now();

  const res = await fetch('/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ message, employee_id: employeeId, history })
  });
  const data = await res.json();

  document.getElementById('answer').textContent = data.answer || JSON.stringify(data);
  document.getElementById('workflowBadge').innerHTML = data.workflow ? `<span class="badge">${data.workflow}</span>` : '';
  document.getElementById('latency').textContent = `latency: ${data.latency_ms} ms (client roundtrip: ${Math.round(performance.now() - start)} ms)`;

  const citeDiv = document.getElementById('citations');
  citeDiv.innerHTML = '';
  (data.citations || []).forEach(c => {
    const el = document.createElement('div');
    el.className = 'cite';
    el.innerHTML = `<strong>${c.title || c.doc_id}</strong> — ${c.section || ''}<br>${c.snippet || ''}`;
    citeDiv.appendChild(el);
  });

  document.getElementById('trace').textContent = JSON.stringify(data.trace || [], null, 2);

  history.push({ role: 'user', content: message });
  history.push({ role: 'assistant', content: data.answer || '' });
  document.getElementById('message').value = '';
}

document.getElementById('message').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') send();
});
</script>
</body>
</html>
